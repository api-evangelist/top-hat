aid: top-hat
name: Top Hat
description: 'Top Hat is an interactive learning platform for higher education, used
  by instructors and students at colleges and universities to run more engaging courses.
  It combines in-class polling, quizzes, attendance, and discussions with interactive
  digital textbooks and courseware, assessments and grading, and AI-powered teaching
  and study assistance, all running on students'' own devices and integrating with
  campus LMS platforms. Founded in 2009 and headquartered in Toronto, Top Hat is backed
  by Emergence Capital, Uncork Capital, Union Square Ventures, and Version One Ventures.
  Top Hat does not currently publish a public developer API or developer portal; this
  API Evangelist profile captures its public web, security, trust, and status surface.'
